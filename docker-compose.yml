services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-chat-local-access}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-chat-local-secret-key}
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_ORIGIN:-http://chat.test:3000}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  clamav:
    image: clamav/clamav:1.4.3
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMD_CONF_TCPSocket: "3310"
      CLAMD_CONF_TCPAddr: "0.0.0.0"
      CLAMD_CONF_StreamMaxLength: ${CLAMAV_STREAM_MAX_LENGTH_BYTES:-33554432}
      CLAMD_CONF_MaxScanSize: "100M"
      CLAMD_CONF_MaxFileSize: "25M"
      CLAMD_CONF_MaxRecursion: "10"
      CLAMD_CONF_MaxFiles: "1000"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  postgres_data:
  minio_data:
  clamav_data:
