openapi: 3.1.0
info:
  title: Realtime Chat API
  version: 0.1.0
  description: |
    Mevcut backend MVP'nin HTTP sözleşmesi. Bu belge çalışan route, controller,
    Zod şeması, servis ve hata middleware'i kaynak alınarak hazırlanmıştır.

    Kimlik doğrulama ve cookie davranışı:

    - Korumalı uçlarda access token `Authorization: Bearer <token>` başlığındadır.
    - Refresh token, adı `chat_refresh_token` olan `HttpOnly`, `SameSite=Lax`,
      `Path=/api/v1/auth` cookie'sinde tutulur; production ortamında ayrıca
      `Secure` niteliği kullanılır.
    - Production ortamında `/auth/refresh`, `/auth/logout`, `/auth/password` ve
      session silme isteklerinin
      `Origin` başlığı `FRONTEND_ORIGIN` ile bire bir aynı olmalıdır. Diğer
      ortamlarda bu Origin kontrolü uygulanmaz.
    - Register, login, refresh, me, session listesi ve profil güncelleme
      cevapları `Cache-Control: no-store` taşır.

    Güvenlik response header'ları tüm HTTP cevaplarında Helmet 8.3.0'ın
    varsayılan politikalarıyla üretilir. Bunlar arasında
    `X-Content-Type-Options: nosniff`, `X-Frame-Options: SAMEORIGIN`,
    `Content-Security-Policy` içinde `frame-ancestors 'self'` ve
    `Referrer-Policy: no-referrer` bulunur. `Strict-Transport-Security:
    max-age=31536000; includeSubDomains` yalnızca `NODE_ENV=production`
    iken eklenir. CORS origin'i `FRONTEND_ORIGIN` ile sınırlı ve
    credential desteği açıktır. Kaynaklar:
    `src/http/middleware/security-headers.ts`, `src/app.ts`,
    `src/http/middleware/cors.ts`.

    Cursor değerleri base64url kodlanmış, sürümlü JSON'dur. İstemci bunları
    decode etmeye veya üretmeye çalışmadan opak string olarak geri göndermelidir.

    Rate limit politikaları süreç içindeki ayrı bellek depolarında tutulur ve
    süreç yeniden başladığında sıfırlanır. Login `10/15 dakika/IP`, register
    `5/60 dakika/IP`, refresh `30/5 dakika/IP`, kullanıcı arama
    `60/dakika/kullanıcı`, parola değiştirme `10/15 dakika/kullanıcı` ve mesaj
    oluşturma `60/dakika/kullanıcı`; avatar upload intent + complete işlemleri
    ortak `20/15 dakika/kullanıcı` sınırındadır.
    IP kapsamı Express `request.ip` değeridir; uygulama `trust proxy` açmadığı
    için doğrudan TCP eşini temsil eder. Paylaşımlı NAT/CGNAT kullanıcıları aynı
    login/register/refresh kotasını tüketebilir. Limit aşımında standart hata
    gövdesiyle 429 ve pencere sıfırlanana kadar saniye cinsinden `Retry-After`
    döner. Kaynak: `src/http/middleware/rate-limit.ts` ve ilgili route dosyaları.

    Kaynaklar: `src/modules/auth/http/auth.middleware.ts`,
    `src/modules/auth/http/refresh-cookie.ts`, `src/modules/auth/http/auth.routes.ts`,
    `src/modules/auth/http/auth.controller.ts`, `src/shared/pagination/cursor.ts`.
servers:
  - url: http://api.chat.test:4000
    description: README'de belirtilen varsayılan geliştirme adresi
tags:
  - name: Health
    description: Liveness ve PostgreSQL readiness kontrolleri.
  - name: Auth
    description: Kayıt, parola, session yönetimi, token rotasyonu ve mevcut kullanıcı.
  - name: Users
    description: Profil güncelleme ve aktif kullanıcı arama.
  - name: Conversations
    description: Doğrudan konuşma oluşturma, listeleme ve detay.
  - name: Messages
    description: İdempotent mesaj oluşturma ve geçmiş sayfalama.
  - name: Reads
    description: Monoton ilerleyen okundu watermark'ı.

paths:
  /api/v1/healthz:
    get:
      tags: [Health]
      summary: Süreç canlılık kontrolü
      operationId: getHealth
      security: []
      x-source-files:
        - src/http/routes/health.routes.ts
      responses:
        "200":
          description: HTTP süreci canlı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /api/v1/readyz:
    get:
      tags: [Health]
      summary: PostgreSQL hazır olma kontrolü
      operationId: getReadiness
      security: []
      x-source-files:
        - src/http/routes/health.routes.ts
      responses:
        "200":
          description: PostgreSQL `SELECT 1` sorgusuna cevap verdi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ready
        "503":
          description: PostgreSQL erişilebilir değil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: not_ready

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Kullanıcı kaydı ve oturum oluşturma
      operationId: register
      description: IP başına 60 dakikada 5 istekle sınırlıdır.
      security: []
      x-source-files:
        - src/http/middleware/rate-limit.ts
        - src/modules/auth/http/auth.routes.ts
        - src/modules/auth/http/auth.schema.ts
        - src/modules/auth/http/auth.controller.ts
        - src/modules/auth/application/auth.service.ts
        - src/modules/auth/domain/auth.errors.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: alice@example.com
              username: alice
              displayName: Alice
              password: correct-password
      responses:
        "201":
          description: Kullanıcı ve oturum oluşturuldu; refresh cookie set edildi
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: alice@example.com
                  username: alice
                  displayName: Alice
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: "2030-01-01T00:00:00.000Z"
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: E-posta, kullanıcı adı veya kullanıcı tekilliği çakıştı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailAlreadyInUse:
                  value:
                    error:
                      code: EMAIL_ALREADY_IN_USE
                      message: The email is already in use
                      requestId: 77777777-7777-4777-8777-777777777777
                usernameAlreadyInUse:
                  value:
                    error:
                      code: USERNAME_ALREADY_IN_USE
                      message: The username is already in use
                      requestId: 77777777-7777-4777-8777-777777777777
                genericConflict:
                  value:
                    error:
                      code: USER_ALREADY_EXISTS
                      message: A user with these details already exists
                      requestId: 77777777-7777-4777-8777-777777777777
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: E-posta ve parola ile oturum açma
      operationId: login
      description: IP başına 15 dakikada 10 istekle sınırlıdır. Paylaşımlı NAT/CGNAT istemcileri aynı kotayı tüketir.
      security: []
      x-source-files:
        - src/http/middleware/rate-limit.ts
        - src/modules/auth/http/auth.routes.ts
        - src/modules/auth/http/auth.schema.ts
        - src/modules/auth/http/auth.controller.ts
        - src/modules/auth/application/auth.service.ts
        - src/modules/auth/domain/auth.errors.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: alice@example.com
              password: correct-password
      responses:
        "200":
          description: Oturum açıldı; refresh cookie set edildi
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: alice@example.com
                  username: alice
                  displayName: Alice
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: "2030-01-01T00:00:00.000Z"
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: E-posta/parola eşleşmedi veya kullanıcı aktif değil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: The email or password is incorrect
                  requestId: 77777777-7777-4777-8777-777777777777
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token'ı döndürerek yeni access token alma
      operationId: refreshAccessToken
      description: IP başına 5 dakikada 30 istekle sınırlıdır.
      # Cookie/Origin kaynakları: src/modules/auth/http/refresh-cookie.ts,
      # src/modules/auth/http/auth.middleware.ts, src/modules/auth/http/auth.routes.ts.
      security:
        - refreshCookie: []
      x-source-files:
        - src/http/middleware/rate-limit.ts
        - src/modules/auth/http/auth.routes.ts
        - src/modules/auth/http/auth.controller.ts
        - src/modules/auth/http/auth.middleware.ts
        - src/modules/auth/http/refresh-cookie.ts
        - src/modules/auth/sessions/auth-session.service.ts
      parameters:
        - $ref: "#/components/parameters/ProductionOrigin"
      responses:
        "200":
          description: Refresh token döndürüldü; yeni cookie ve access token üretildi
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
              example:
                accessToken: example-rotated-access-token
        "401":
          description: Cookie yok, token geçersiz, iptal edilmiş, süresi dolmuş veya yarışta daha önce döndürülmüş
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_REFRESH_TOKEN
                  message: The refresh token is invalid
                  requestId: 77777777-7777-4777-8777-777777777777
        "403":
          $ref: "#/components/responses/CsrfError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Mevcut access token'a ait oturumu iptal etme
      operationId: logout
      # Bearer/Origin kaynakları: src/modules/auth/http/auth.middleware.ts,
      # src/modules/auth/http/auth.routes.ts. Cookie temizleme kaynağı:
      # src/modules/auth/http/refresh-cookie.ts.
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/auth/http/auth.routes.ts
        - src/modules/auth/http/auth.controller.ts
        - src/modules/auth/http/auth.middleware.ts
        - src/modules/auth/http/refresh-cookie.ts
      parameters:
        - $ref: "#/components/parameters/ProductionOrigin"
      responses:
        "204":
          description: Oturum iptal edildi; refresh cookie temizlendi; gövde yok
          headers:
            Set-Cookie:
              description: |
                `chat_refresh_token` cookie'sini
                `Expires=Thu, 01 Jan 1970 00:00:00 GMT` ile temizler.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "403":
          $ref: "#/components/responses/CsrfError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Mevcut kullanıcıyı alma
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/auth/http/auth.routes.ts
        - src/modules/auth/http/auth.controller.ts
        - src/modules/auth/http/auth.middleware.ts
        - src/modules/auth/application/auth.service.ts
      responses:
        "200":
          description: Aktif kullanıcı
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
              example:
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: alice@example.com
                  username: alice
                  displayName: Alice
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: "2030-01-01T00:00:00.000Z"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/password:
    patch:
      tags: [Auth]
      summary: Mevcut parolayı değiştirme
      operationId: changePassword
      description: |
        Mevcut parolayı doğrular, yeni parolayı register ile aynı kurala göre
        kaydeder ve mevcut session dışındaki tüm session'ları iptal eder.
        Doğrulanmış kullanıcı başına 15 dakikada 10 istekle sınırlıdır.
      security:
        - bearerAuth: []
      x-source-files:
        - src/http/middleware/rate-limit.ts
        - src/modules/auth/http/auth.routes.ts
        - src/modules/auth/http/auth.schema.ts
        - src/modules/auth/http/auth.controller.ts
        - src/modules/auth/application/auth.service.ts
      parameters:
        - $ref: "#/components/parameters/ProductionOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Parola değiştirildi ve diğer session'lar iptal edildi; gövde yok
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Bearer token geçersiz veya mevcut parola yanlış
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/CsrfError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      summary: Aktif session'ları listeleme
      operationId: listAuthSessions
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/auth/http/auth.routes.ts
        - src/modules/auth/http/auth.controller.ts
        - src/modules/auth/application/auth.service.ts
        - src/modules/auth/sessions/auth-session.repository.ts
      responses:
        "200":
          description: Süresi dolmamış ve iptal edilmemiş session'lar
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionListResponse"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Auth]
      summary: Mevcut session dışındaki tüm session'ları iptal etme
      operationId: revokeOtherAuthSessions
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/auth/http/auth.routes.ts
        - src/modules/auth/http/auth.controller.ts
        - src/modules/auth/application/auth.service.ts
        - src/modules/auth/sessions/auth-session.repository.ts
      parameters:
        - $ref: "#/components/parameters/ProductionOrigin"
      responses:
        "204":
          description: Diğer session'lar iptal edildi; gövde yok
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "403":
          $ref: "#/components/responses/CsrfError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Belirli bir session'ı iptal etme
      operationId: revokeAuthSession
      description: |
        Session yalnızca doğrulanmış kullanıcıya aitse iptal edilir. Hedef mevcut
        session ise refresh cookie de temizlenir. Başkasına ait veya zaten iptal
        edilmiş bir kimlik bilgi sızdırmamak için yine 204 döner.
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/auth/http/auth.routes.ts
        - src/modules/auth/http/auth.controller.ts
        - src/modules/auth/application/auth.service.ts
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ProductionOrigin"
      responses:
        "204":
          description: İşlem tamamlandı; gövde yok
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "403":
          $ref: "#/components/responses/CsrfError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me:
    patch:
      tags: [Users]
      summary: Mevcut kullanıcının profilini güncelleme
      operationId: updateCurrentUser
      description: "`username` ve/veya `displayName` gönderilmelidir."
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/users/users.routes.ts
        - src/modules/users/users.schema.ts
        - src/modules/users/users.controller.ts
        - src/modules/users/users.service.ts
        - src/modules/users/users.repository.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserRequest"
      responses:
        "200":
          description: Güncellenmiş kullanıcı profili
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "409":
          description: Kullanıcı adı zaten kullanımda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: USERNAME_ALREADY_IN_USE
                  message: The username is already in use
                  requestId: 77777777-7777-4777-8777-777777777777
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me/avatar/uploads:
    post:
      tags: [Users]
      summary: Avatar için doğrudan object-storage yükleme adresi oluşturma
      operationId: createAvatarUpload
      description: |
        İstemci dosyayı API gövdesine göndermez. Bu uçtan alınan imzalı URL'ye
        dönen `Content-Type` başlığıyla `PUT` yapar, ardından complete ucunu çağırır.
        Upload intent ve complete aynı kullanıcı bazlı `20/15 dakika` kotasını tüketir.
        JPEG, PNG ve WebP kabul edilir; HEIC/HEIF, SVG, GIF ve video kabul edilmez.
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/users/users.routes.ts
        - src/modules/media/avatar.schema.ts
        - src/modules/media/avatar.controller.ts
        - src/modules/media/avatar.service.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAvatarUploadRequest"
            example:
              contentType: image/jpeg
              contentLength: 245760
      responses:
        "201":
          description: On dakika geçerli, Content-Type'a bağlı imzalı PUT adresi
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadIntent"
        "400":
          description: Gövde doğrulama hatası veya desteklenmeyen format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation:
                  $ref: "#/components/examples/ValidationErrorExample"
                unsupportedFormat:
                  value:
                    error:
                      code: UNSUPPORTED_AVATAR_FORMAT
                      message: Avatar format is not supported; use JPEG, PNG, or WebP
                      requestId: 77777777-7777-4777-8777-777777777777
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AvatarStorageUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me/avatar/uploads/{uploadId}/complete:
    post:
      tags: [Users]
      summary: Yüklenen avatarı doğrulama, dönüştürme ve profile bağlama
      operationId: completeAvatarUpload
      description: |
        Private `incoming/` nesnesini okur; gerçek MIME, byte boyutu ve görseli
        doğrular. En fazla 5 MiB ve 4096×4096 kaynak kabul edilir. Sonuç metadata'sı
        temizlenmiş sabit 512×512 WebP olarak public `public/` prefix'ine yazılır.
        Aynı tamamlanmış güncel upload için retry idempotenttir.
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/users/users.routes.ts
        - src/modules/media/avatar.controller.ts
        - src/modules/media/avatar.service.ts
        - src/modules/media/avatar-image.processor.ts
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Avatar profile bağlandı; güncel kullanıcı döndü
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "404":
          description: Upload bulunamadı veya bu kullanıcıya ait değil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: AVATAR_UPLOAD_NOT_FOUND
                  message: The avatar upload was not found
