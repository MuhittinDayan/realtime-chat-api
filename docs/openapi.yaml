          description: Attachment binding çakıştı veya doğrulanmış toplam ek boyutu 50 MiB sınırını aştı (`ATTACHMENT_BINDING_CONFLICT` veya `MESSAGE_ATTACHMENTS_TOTAL_SIZE_EXCEEDED`)
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Messages]
      summary: Mesaj geçmişini listeleme
      operationId: listMessages
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/messages/message.routes.ts
        - src/modules/messages/message.schema.ts
        - src/modules/messages/message.controller.ts
        - src/modules/messages/message.service.ts
        - src/modules/messages/message.repository.ts
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: before
          in: query
          required: false
          description: Önceki cevabın `nextCursor` değeri; bu cursor'dan daha eski mesajları ister.
          schema:
            type: string
            minLength: 1
            maxLength: 512
          example: eyJ2IjoxLCJjcmVhdGVkQXQiOiIyMDMwLTAxLTAxVDAwOjAwOjAwLjAwMFoiLCJpZCI6IjQ0NDQ0NDQ0LTQ0NDQtNDQ0NC04NDQ0LTQ0NDQ0NDQ0NDQ0NCJ9
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 50
      responses:
        "200":
          description: Sayfa içindeki mesajlar kronolojik (eskiden yeniye) sırada döner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageHistoryResponse"
              example:
                items:
                  - id: 44444444-4444-4444-8444-444444444444
                    conversationId: 33333333-3333-4333-8333-333333333333
                    senderId: 11111111-1111-4111-8111-111111111111
                    clientMessageId: 55555555-5555-4555-8555-555555555555
                    kind: TEXT
                    body: Merhaba
                    createdAt: "2030-01-01T00:00:00.000Z"
                    editedAt: null
                    deletedAt: null
                nextCursor: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/conversations/{conversationId}/messages/{messageId}:
    patch:
      tags: [Messages]
      summary: Gönderenin TEXT içeriğini veya MEDIA caption'ını düzenlemesi
      operationId: updateMessage
      description: |
        Yalnızca mesajı gönderen aktif conversation üyesi düzenleyebilir. Trim
        edilmiş içerik mevcut body ile aynıysa işlem idempotent no-op olur;
        `editedAt` değişmez ve `message:updated` yayınlanmaz. Silinmiş mesaj
        düzenlenemez. MEDIA mesajında yalnızca caption değişir; attachment listesi
        sabittir ve `attachmentIds` strict validation ile reddedilir. `text: null`
        caption'ı kaldırır.
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/messages/message.routes.ts
        - src/modules/messages/message.schema.ts
        - src/modules/messages/message.controller.ts
        - src/modules/messages/message.service.ts
        - src/modules/messages/message.repository.ts
        - src/modules/messages/message.errors.ts
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMessageRequest"
            example:
              content:
                type: text
                text: Düzenlenmiş mesaj
      responses:
        "200":
          description: Güncel mesaj; değişiklik yapıldıysa commit sonrasında `message:updated` yayınlanır
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                id: 44444444-4444-4444-8444-444444444444
                conversationId: 33333333-3333-4333-8333-333333333333
                senderId: 11111111-1111-4111-8111-111111111111
                clientMessageId: 55555555-5555-4555-8555-555555555555
                kind: TEXT
                body: Düzenlenmiş mesaj
                createdAt: "2030-01-01T00:00:00.000Z"
                editedAt: "2030-01-01T00:03:00.000Z"
                deletedAt: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "404":
          $ref: "#/components/responses/MessageMutationNotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Messages]
      summary: Gönderenin mesajını soft-delete etmesi
      operationId: deleteMessage
      description: |
        Kayıt DB'den silinmez. İlk başarılı silmede `deletedAt` yazılır ve commit
        sonrasında `message:deleted` yayınlanır. Aynı gönderenin tekrarlanan silme
        isteği aynı tombstone'u döndürür; timestamp değişmez ve ikinci event
        yayınlanmaz. MEDIA tombstone `body: null` ve `attachments: []` taşır;
        private erişim anında kesilir, fiziksel silme retention worker'a bırakılır.
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/messages/message.routes.ts
        - src/modules/messages/message.controller.ts
        - src/modules/messages/message.service.ts
        - src/modules/messages/message.repository.ts
        - src/modules/messages/message.errors.ts
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: İçeriği maskelenmiş mesaj tombstone'u
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                id: 44444444-4444-4444-8444-444444444444
                conversationId: 33333333-3333-4333-8333-333333333333
                senderId: 11111111-1111-4111-8111-111111111111
                clientMessageId: 55555555-5555-4555-8555-555555555555
                kind: TEXT
                body: null
                createdAt: "2030-01-01T00:00:00.000Z"
                editedAt: "2030-01-01T00:03:00.000Z"
                deletedAt: "2030-01-01T00:05:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "404":
          $ref: "#/components/responses/MessageMutationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/conversations/{conversationId}/read:
    put:
      tags: [Reads]
      summary: Kullanıcının okundu watermark'ını ileri taşıma
      operationId: updateReadWatermark
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/reads/read.routes.ts
        - src/modules/reads/read.schema.ts
        - src/modules/reads/read.controller.ts
        - src/modules/reads/read.service.ts
        - src/modules/reads/read.repository.ts
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadRequest"
            example:
              throughMessageId: 44444444-4444-4444-8444-444444444444
      responses:
        "200":
          description: Watermark oluşturuldu, ileri taşındı veya daha eski/eşit hedefte değişmedi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadWatermarkResponse"
              example:
                conversationId: 33333333-3333-4333-8333-333333333333
                throughMessageId: 44444444-4444-4444-8444-444444444444
                readAt: "2030-01-01T00:00:00.000Z"
                status: advanced
        "400":
          description: UUID/body doğrulaması başarısız veya mesaj bu konuşmaya ait değil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation:
                  $ref: "#/components/examples/ValidationErrorExample"
                wrongConversation:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The request is invalid
                      details:
                        issues:
                          - path: body.throughMessageId
                            message: Message does not belong to this conversation
                      requestId: 77777777-7777-4777-8777-777777777777
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access-token>`. JWT doğrulandıktan sonra token'daki
        `sid` ve `sub`, aktif ve kullanıcıya ait DB oturumuna karşı kontrol edilir.
        Kaynak: `src/modules/auth/http/auth.middleware.ts`,
        `src/modules/auth/application/auth.service.ts`,
        `src/modules/auth/sessions/auth-session.repository.ts`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: chat_refresh_token
      description: |
        Opaque refresh token. `HttpOnly`, `SameSite=Lax`,
        `Path=/api/v1/auth`; production'da `Secure`.
        Kaynak: `src/modules/auth/auth.constants.ts`,
        `src/modules/auth/http/refresh-cookie.ts`.

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 33333333-3333-4333-8333-333333333333
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 66666666-6666-4666-8666-666666666666
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 44444444-4444-4444-8444-444444444444
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 22222222-2222-4222-8222-222222222222
    ProductionOrigin:
      name: Origin
      in: header
      required: false
      description: |
        Production ortamında zorunludur ve `FRONTEND_ORIGIN` ile bire bir
        karşılaştırılır; eşleşmezse `403 CSRF_VALIDATION_FAILED` döner.
        Development/test ortamında middleware bu kontrolü atlar.
        Kaynak: `src/modules/auth/http/auth.routes.ts`,
        `src/modules/auth/http/auth.middleware.ts`.
      schema:
        type: string
        format: uri
      example: https://chat.example.com

  headers:
    NoStore:
      description: Hassas auth cevabının cache'lenmesini engeller.
      schema:
        type: string
        const: no-store
    RefreshCookie:
      description: |
        `chat_refresh_token=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=Lax`.
        `Max-Age` ve `Expires` session süresinden hesaplanır; production'da
        `Secure` eklenir. Kaynak: `src/modules/auth/http/refresh-cookie.ts`.
      schema:
        type: string
    RetryAfter:
      description: Rate-limit penceresinin sıfırlanmasına kalan tam saniye.
      schema:
        type: integer
        minimum: 1
      example: 60

  responses:
    AttachmentStorageUnavailable:
      description: Attachment object storage geçici olarak kullanılamıyor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: ATTACHMENT_STORAGE_UNAVAILABLE
              message: Attachment storage is temporarily unavailable
              requestId: 77777777-7777-4777-8777-777777777777
    AttachmentProcessingUnavailable:
      description: Attachment storage veya malware scanner geçici olarak kullanılamıyor; scanner hatası kalıcı ret değildir ve complete yeniden denenebilir
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            storageUnavailable:
              value:
                error:
                  code: ATTACHMENT_STORAGE_UNAVAILABLE
                  message: Attachment storage is temporarily unavailable
                  requestId: 77777777-7777-4777-8777-777777777777
            scanUnavailable:
              value:
                error:
                  code: ATTACHMENT_SCAN_UNAVAILABLE
                  message: Attachment malware scanning is temporarily unavailable
                  requestId: 77777777-7777-4777-8777-777777777777
    AvatarStorageUnavailable:
      description: Object storage geçici olarak kullanılamıyor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: AVATAR_STORAGE_UNAVAILABLE
              message: Avatar storage is temporarily unavailable
              requestId: 77777777-7777-4777-8777-777777777777
    InsufficientRole:
      description: Active member role does not permit the operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INSUFFICIENT_ROLE
              message: Your role does not permit this action
              requestId: 77777777-7777-4777-8777-777777777777
    ConversationConflict:
      description: Membership, capacity, OWNER-target, or last-OWNER conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            ownership:
              value:
                error:
                  code: CONFLICT
                  message: Ownership must be transferred first
                  requestId: 77777777-7777-4777-8777-777777777777
            capacity:
              value:
                error:
                  code: CONFLICT
                  message: Group has reached the 100 active member limit
                  requestId: 77777777-7777-4777-8777-777777777777
    RateLimited:
      description: İlgili endpoint'in bağımsız kotası aşıldı
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit:
          description: express-rate-limit tarafından draft-8 biçiminde üretilen mevcut kota durumu.
          schema:
            type: string
        RateLimit-Policy:
          description: express-rate-limit tarafından draft-8 biçiminde üretilen kota politikası.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Too many requests
              requestId: 77777777-7777-4777-8777-777777777777
    ValidationError:
      description: Zod/request doğrulaması veya bozuk JSON
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              $ref: "#/components/examples/ValidationErrorExample"
            invalidJson:
              value:
                error:
                  code: INVALID_JSON
                  message: Request body contains invalid JSON
                  requestId: 77777777-7777-4777-8777-777777777777
    BearerUnauthorized:
      description: Bearer header yok/bozuk veya access token/DB oturumu geçersiz
      headers:
        WWW-Authenticate:
          description: Bearer challenge
          schema:
            type: string
            const: 'Bearer realm="chat-api"'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingBearer:
              value:
                error:
                  code: AUTHENTICATION_REQUIRED
                  message: Authentication is required
                  requestId: 77777777-7777-4777-8777-777777777777
            invalidToken:
              value:
                error:
                  code: INVALID_TOKEN
                  message: The token is invalid
                  requestId: 77777777-7777-4777-8777-777777777777
    CsrfError:
      description: Production `Origin` başlığı `FRONTEND_ORIGIN` ile eşleşmedi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CSRF_VALIDATION_FAILED
              message: The request origin is not allowed
              requestId: 77777777-7777-4777-8777-777777777777
    ConversationNotFound:
      description: Konuşma bulunamadı veya kullanıcı aktif üye değil; iki durum aynı cevapla gizlenir
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CONVERSATION_NOT_FOUND
              message: Conversation not found
              requestId: 77777777-7777-4777-8777-777777777777
    MessageMutationNotFound:
      description: |
        Conversation bulunamadı/aktif üyelik yok veya mesaj bulunamadı,
        gönderene ait değil ya da düzenleme sırasında zaten silinmiş. Varlık ve
        yetki ayrıntıları 404 altında gizlenir.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            conversationNotFound:
              value:
                error:
                  code: CONVERSATION_NOT_FOUND
                  message: Conversation not found
                  requestId: 77777777-7777-4777-8777-777777777777
            messageNotFound:
              value:
                error:
                  code: MESSAGE_NOT_FOUND
                  message: Message not found
                  requestId: 77777777-7777-4777-8777-777777777777
    PayloadTooLarge:
      description: JSON gövdesi 1 MiB sınırını aştı
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Request body is too large
              requestId: 77777777-7777-4777-8777-777777777777
    InternalError:
      description: Beklenmeyen sunucu hatası; iç hata ayrıntısı istemciye açılmaz
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected error occurred
              requestId: 77777777-7777-4777-8777-777777777777

  examples:
    ValidationErrorExample:
      value:
        error:
          code: VALIDATION_ERROR
          message: The request is invalid
          details:
            issues:
              - path: body.email
                message: Invalid email address
          requestId: 77777777-7777-4777-8777-777777777777

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, username, displayName, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Trim edilir ve küçük harfe çevrilir.
        username:
          type: string
          minLength: 1
          maxLength: 32
          description: Trim edilir.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Trim edilir.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Trim edilir ve küçük harfe çevrilir.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    UpdateCurrentUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
          description: Trim edilir ve tekil olmalıdır.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Trim edilir.
    CreateAvatarUploadRequest:
      type: object
      additionalProperties: false
      required: [contentType, contentLength]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: İmzaya bağlanacak kaynak MIME türü.
        contentLength:
          type: integer
          minimum: 1
          maximum: 5242880
          description: Kaynak nesnenin byte boyutu; complete aşamasında kesin doğrulanır.
    AvatarUploadIntent:
      type: object
      additionalProperties: false
      required: [uploadId, upload]
      properties:
        uploadId:
          type: string
          format: uuid
        upload:
          type: object
          additionalProperties: false
          required: [url, method, headers, expiresAt]
          properties:
            url:
              type: string
              format: uri
              description: Private incoming nesnesine ait, on dakika geçerli imzalı URL.
            method:
              type: string
              const: PUT
            headers:
              type: object
              additionalProperties:
                type: string
              description: PUT sırasında aynen gönderilmelidir; Content-Type imzaya dahildir.
            expiresAt:
              type: string
              format: date-time
    PublicUser:
      type: object
      additionalProperties: false
      required: [id, email, username, displayName, avatarUrl, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: [string, "null"]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
    PublicPeerUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: [string, "null"]
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, accessToken]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        accessToken:
          type: string
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [accessToken]
      properties:
        accessToken:
          type: string
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
    AuthSession:
      type: object
      additionalProperties: false
      required: [id, userAgent, createdAt, lastUsedAt, expiresAt, isCurrent]
      properties:
        id:
          type: string
          format: uuid
        userAgent:
          type: [string, "null"]
          description: Session oluşturulurken gelen User-Agent; eski session'larda null olabilir.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
    AuthSessionListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuthSession"
    UserSearchResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicPeerUser"
        nextCursor:
          type: [string, "null"]
    CreateDirectConversationRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
    UserIdRequest:
      type: object
      additionalProperties: false
