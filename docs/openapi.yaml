        senderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
    ListedDirectConversation:
      type: object
      additionalProperties: false
      required: [id, type, title, createdAt, otherUser, lastMessageAt, lastMessage, unreadCount]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: DIRECT
        title:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        otherUser:
          $ref: "#/components/schemas/PublicPeerUser"
        lastMessageAt:
          type: [string, "null"]
          format: date-time
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/LastMessage"
            - type: "null"
        unreadCount:
          type: integer
          minimum: 0
    ListedGroupConversation:
      type: object
      additionalProperties: false
      required: [id, type, title, createdAt, members, lastMessageAt, lastMessage, unreadCount]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: GROUP
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GroupMember"
        lastMessageAt:
          type: [string, "null"]
          format: date-time
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/LastMessage"
            - type: "null"
        unreadCount:
          type: integer
          minimum: 0
    ListedConversation:
      oneOf:
        - $ref: "#/components/schemas/ListedDirectConversation"
        - $ref: "#/components/schemas/ListedGroupConversation"
      discriminator:
        propertyName: type
    ConversationListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedConversation"
        nextCursor:
          type: [string, "null"]
    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [clientMessageId, content]
      properties:
        clientMessageId:
          type: string
          format: uuid
        content:
          oneOf:
            - $ref: "#/components/schemas/TextMessageContent"
            - $ref: "#/components/schemas/MediaMessageContent"
    UpdateMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          oneOf:
            - $ref: "#/components/schemas/TextMessageContent"
            - $ref: "#/components/schemas/MediaCaptionUpdateContent"
    TextMessageContent:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
          minLength: 1
          maxLength: 4000
    MediaMessageContent:
      type: object
      additionalProperties: false
      required: [type, attachmentIds]
      properties:
        type:
          type: string
          const: media
        text:
          type: string
          minLength: 1
          maxLength: 4000
        attachmentIds:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: IMAGE ve PDF birlikte kullanılabilir; doğrulanmış actualSize toplamı en fazla 52428800 byte olabilir.
          items:
            type: string
            format: uuid
    MediaCaptionUpdateContent:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          const: media
        text:
          type: [string, "null"]
          minLength: 1
          maxLength: 4000
    CreateAttachmentUploadRequest:
      type: object
      additionalProperties: false
      required: [contentType, contentLength, originalFileName]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        contentLength:
          type: integer
          minimum: 1
          maximum: 26214400
          description: IMAGE için en fazla 10485760, PDF için en fazla 26214400 byte.
        originalFileName:
          type: string
          minLength: 1
    AttachmentUploadIntent:
      type: object
      additionalProperties: false
      required: [attachmentId, upload]
      properties:
        attachmentId:
          type: string
          format: uuid
        upload:
          $ref: "#/components/schemas/PresignedUpload"
    PresignedUpload:
      type: object
      additionalProperties: false
      required: [url, method, headers, expiresAt]
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          const: PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    MessageAttachment:
      oneOf:
        - $ref: "#/components/schemas/ImageMessageAttachment"
        - $ref: "#/components/schemas/PdfMessageAttachment"
      discriminator:
        propertyName: kind
    ImageMessageAttachment:
      type: object
      additionalProperties: false
      required: [id, kind, originalFileName, contentType, width, height, url, thumbnailUrl]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          const: IMAGE
        originalFileName:
          type: string
        contentType:
          type: string
          const: image/webp
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        url:
          type: string
        thumbnailUrl:
          type: string
    PdfMessageAttachment:
      type: object
      additionalProperties: false
      required: [id, kind, originalFileName, contentType, url]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          const: PDF
        originalFileName:
          type: string
        contentType:
          type: string
          const: application/pdf
        url:
          type: string
    Message:
      oneOf:
        - $ref: "#/components/schemas/TextMessage"
        - $ref: "#/components/schemas/MediaMessage"
      discriminator:
        propertyName: kind
    MessageBase:
      type: object
      required: [id, conversationId, senderId, clientMessageId, kind, body, createdAt, editedAt, deletedAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        clientMessageId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [TEXT, MEDIA]
        body:
          type: [string, "null"]
          description: Soft-delete edilmiş mesajda null; saklanan DB içeriği API'de açılmaz.
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, "null"]
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
    TextMessage:
      allOf:
        - $ref: "#/components/schemas/MessageBase"
        - type: object
          properties:
            kind:
              const: TEXT
    MediaMessage:
      allOf:
        - $ref: "#/components/schemas/MessageBase"
        - type: object
          required: [attachments]
          properties:
            kind:
              const: MEDIA
            attachments:
              type: array
              maxItems: 4
              description: Silinmiş MEDIA mesajında boş dizidir.
              items:
                $ref: "#/components/schemas/MessageAttachment"
    MessageHistoryResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextCursor:
          type: [string, "null"]
    UpdateReadRequest:
      type: object
      additionalProperties: false
      required: [throughMessageId]
      properties:
        throughMessageId:
          type: string
          format: uuid
    ReadWatermarkResponse:
      type: object
      additionalProperties: false
      required: [conversationId, throughMessageId, readAt, status]
      properties:
        conversationId:
          type: string
          format: uuid
        throughMessageId:
          type: string
          format: uuid
        readAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [created, advanced, unchanged]
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                issues:
                  type: array
                  items:
                    $ref: "#/components/schemas/ValidationIssue"
            requestId:
              type: string
