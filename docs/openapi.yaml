      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [MEMBER, ADMIN, OWNER]
        joinedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/PublicPeerUser"
    GroupConversation:
      type: object
      additionalProperties: false
