openapi: 3.1.0
info:
  title: Realtime Chat API
  version: 0.1.0
  description: |
    Mevcut backend MVP'nin HTTP sözleşmesi. Bu belge çalışan route, controller,
    Zod şeması, servis ve hata middleware'i kaynak alınarak hazırlanmıştır.

    Kimlik doğrulama ve cookie davranışı:

    - Korumalı uçlarda access token `Authorization: Bearer <token>` başlığındadır.
    - Refresh token, adı `chat_refresh_token` olan `HttpOnly`, `SameSite=Lax`,
      `Path=/api/v1/auth` cookie'sinde tutulur; production ortamında ayrıca
      `Secure` niteliği kullanılır.
    - Production ortamında `/auth/refresh` ve `/auth/logout` isteklerinin
      `Origin` başlığı `FRONTEND_ORIGIN` ile bire bir aynı olmalıdır. Diğer
      ortamlarda bu Origin kontrolü uygulanmaz.
    - Register, login, refresh ve me cevapları `Cache-Control: no-store` taşır.

    Güvenlik response header'ları tüm HTTP cevaplarında Helmet 8.3.0'ın
    varsayılan politikalarıyla üretilir. Bunlar arasında
    `X-Content-Type-Options: nosniff`, `X-Frame-Options: SAMEORIGIN`,
    `Content-Security-Policy` içinde `frame-ancestors 'self'` ve
    `Referrer-Policy: no-referrer` bulunur. `Strict-Transport-Security:
    max-age=31536000; includeSubDomains` yalnızca `NODE_ENV=production`
    iken eklenir. CORS origin'i `FRONTEND_ORIGIN` ile sınırlı ve
    credential desteği açıktır. Kaynaklar:
    `src/http/middleware/security-headers.ts`, `src/app.ts`,
    `src/http/middleware/cors.ts`.

    Cursor değerleri base64url kodlanmış, sürümlü JSON'dur. İstemci bunları
    decode etmeye veya üretmeye çalışmadan opak string olarak geri göndermelidir.

    Rate limit politikaları süreç içindeki ayrı bellek depolarında tutulur ve
    süreç yeniden başladığında sıfırlanır. Login `10/15 dakika/IP`, register
    `5/60 dakika/IP`, refresh `30/5 dakika/IP`, kullanıcı arama
    `60/dakika/kullanıcı` ve mesaj oluşturma `60/dakika/kullanıcı` sınırındadır.
    IP kapsamı Express `request.ip` değeridir; uygulama `trust proxy` açmadığı
    için doğrudan TCP eşini temsil eder. Paylaşımlı NAT/CGNAT kullanıcıları aynı
    login/register/refresh kotasını tüketebilir. Limit aşımında standart hata
    gövdesiyle 429 ve pencere sıfırlanana kadar saniye cinsinden `Retry-After`
    döner. Kaynak: `src/http/middleware/rate-limit.ts` ve ilgili route dosyaları.

    Kaynaklar: `src/modules/auth/auth.middleware.ts`,
    `src/modules/auth/refresh-cookie.ts`, `src/modules/auth/auth.routes.ts`,
    `src/modules/auth/auth.controller.ts`, `src/shared/pagination/cursor.ts`.
servers:
  - url: http://api.chat.test:4000
    description: README'de belirtilen varsayılan geliştirme adresi
tags:
  - name: Health
    description: Liveness ve PostgreSQL readiness kontrolleri.
  - name: Auth
    description: Kayıt, oturum, token rotasyonu ve mevcut kullanıcı.
  - name: Users
    description: Aktif kullanıcı arama.
  - name: Conversations
    description: Doğrudan konuşma oluşturma, listeleme ve detay.
  - name: Messages
    description: İdempotent mesaj oluşturma ve geçmiş sayfalama.
  - name: Reads
    description: Monoton ilerleyen okundu watermark'ı.

paths:
  /api/v1/healthz:
    get:
      tags: [Health]
      summary: Süreç canlılık kontrolü
      operationId: getHealth
      security: []
      x-source-files:
        - src/http/routes/health.routes.ts
      responses:
        "200":
          description: HTTP süreci canlı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /api/v1/readyz:
    get:
      tags: [Health]
      summary: PostgreSQL hazır olma kontrolü
      operationId: getReadiness
      security: []
      x-source-files:
        - src/http/routes/health.routes.ts
      responses:
        "200":
          description: PostgreSQL `SELECT 1` sorgusuna cevap verdi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ready
        "503":
          description: PostgreSQL erişilebilir değil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: not_ready

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Kullanıcı kaydı ve oturum oluşturma
      operationId: register
      description: IP başına 60 dakikada 5 istekle sınırlıdır.
      security: []
      x-source-files:
        - src/http/middleware/rate-limit.ts
        - src/modules/auth/auth.routes.ts
        - src/modules/auth/auth.schema.ts
        - src/modules/auth/auth.controller.ts
        - src/modules/auth/auth.service.ts
        - src/modules/auth/auth.errors.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: alice@example.com
              username: alice
              displayName: Alice
              password: correct-password
      responses:
        "201":
          description: Kullanıcı ve oturum oluşturuldu; refresh cookie set edildi
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: alice@example.com
                  username: alice
                  displayName: Alice
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: "2030-01-01T00:00:00.000Z"
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: E-posta, kullanıcı adı veya kullanıcı tekilliği çakıştı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailAlreadyInUse:
                  value:
                    error:
                      code: EMAIL_ALREADY_IN_USE
                      message: The email is already in use
                      requestId: 77777777-7777-4777-8777-777777777777
                usernameAlreadyInUse:
                  value:
                    error:
                      code: USERNAME_ALREADY_IN_USE
                      message: The username is already in use
                      requestId: 77777777-7777-4777-8777-777777777777
                genericConflict:
                  value:
                    error:
                      code: USER_ALREADY_EXISTS
                      message: A user with these details already exists
                      requestId: 77777777-7777-4777-8777-777777777777
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: E-posta ve parola ile oturum açma
      operationId: login
      description: IP başına 15 dakikada 10 istekle sınırlıdır. Paylaşımlı NAT/CGNAT istemcileri aynı kotayı tüketir.
      security: []
      x-source-files:
        - src/http/middleware/rate-limit.ts
        - src/modules/auth/auth.routes.ts
        - src/modules/auth/auth.schema.ts
        - src/modules/auth/auth.controller.ts
        - src/modules/auth/auth.service.ts
        - src/modules/auth/auth.errors.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: alice@example.com
              password: correct-password
      responses:
        "200":
          description: Oturum açıldı; refresh cookie set edildi
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: alice@example.com
                  username: alice
                  displayName: Alice
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: "2030-01-01T00:00:00.000Z"
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: E-posta/parola eşleşmedi veya kullanıcı aktif değil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: The email or password is incorrect
                  requestId: 77777777-7777-4777-8777-777777777777
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token'ı döndürerek yeni access token alma
      operationId: refreshAccessToken
      description: IP başına 5 dakikada 30 istekle sınırlıdır.
      # Cookie/Origin kaynakları: src/modules/auth/refresh-cookie.ts,
      # src/modules/auth/auth.middleware.ts, src/modules/auth/auth.routes.ts.
      security:
        - refreshCookie: []
      x-source-files:
        - src/http/middleware/rate-limit.ts
        - src/modules/auth/auth.routes.ts
        - src/modules/auth/auth.controller.ts
        - src/modules/auth/auth.middleware.ts
        - src/modules/auth/refresh-cookie.ts
        - src/modules/auth/sessions/auth-session.service.ts
      parameters:
        - $ref: "#/components/parameters/ProductionOrigin"
      responses:
        "200":
          description: Refresh token döndürüldü; yeni cookie ve access token üretildi
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
              example:
                accessToken: example-rotated-access-token
        "401":
          description: Cookie yok, token geçersiz, iptal edilmiş, süresi dolmuş veya yarışta daha önce döndürülmüş
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_REFRESH_TOKEN
                  message: The refresh token is invalid
                  requestId: 77777777-7777-4777-8777-777777777777
        "403":
          $ref: "#/components/responses/CsrfError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Mevcut access token'a ait oturumu iptal etme
      operationId: logout
      # Bearer/Origin kaynakları: src/modules/auth/auth.middleware.ts,
      # src/modules/auth/auth.routes.ts. Cookie temizleme kaynağı:
      # src/modules/auth/refresh-cookie.ts.
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/auth/auth.routes.ts
        - src/modules/auth/auth.controller.ts
        - src/modules/auth/auth.middleware.ts
        - src/modules/auth/refresh-cookie.ts
      parameters:
        - $ref: "#/components/parameters/ProductionOrigin"
      responses:
        "204":
          description: Oturum iptal edildi; refresh cookie temizlendi; gövde yok
          headers:
            Set-Cookie:
              description: |
                `chat_refresh_token` cookie'sini
                `Expires=Thu, 01 Jan 1970 00:00:00 GMT` ile temizler.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "403":
          $ref: "#/components/responses/CsrfError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Mevcut kullanıcıyı alma
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/auth/auth.routes.ts
        - src/modules/auth/auth.controller.ts
        - src/modules/auth/auth.middleware.ts
        - src/modules/auth/auth.service.ts
      responses:
        "200":
          description: Aktif kullanıcı
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
              example:
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: alice@example.com
                  username: alice
                  displayName: Alice
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: "2030-01-01T00:00:00.000Z"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users:
    get:
      tags: [Users]
      summary: Aktif kullanıcıları kullanıcı adı veya görünen ad ile arama
      operationId: searchUsers
      description: Doğrulanmış kullanıcı başına dakikada 60 istekle sınırlıdır.
      security:
        - bearerAuth: []
      x-source-files:
        - src/http/middleware/rate-limit.ts
        - src/modules/users/users.routes.ts
        - src/modules/users/users.schema.ts
        - src/modules/users/users.controller.ts
        - src/modules/users/users.service.ts
        - src/modules/users/users.repository.ts
      parameters:
        - name: query
          in: query
          required: true
          description: Trim edilir; kullanıcı adı ve görünen adda büyük/küçük harf duyarsız aranır. E-posta aranmaz.
          schema:
            type: string
            minLength: 2
            maxLength: 80
          example: bo
        - name: cursor
          in: query
          required: false
          description: Önceki cevabın `nextCursor` değeri; opak base64url string olarak kullanılmalıdır.
          schema:
            type: string
            minLength: 1
            maxLength: 512
          example: eyJ2IjoxLCJ1c2VybmFtZSI6ImJvYiIsImlkIjoiMjIyMjIyMjItMjIyMi00MjIyLTgyMjItMjIyMjIyMjIyMjIyIn0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
      responses:
        "200":
          description: Eşleşen kullanıcı sayfası; mevcut kullanıcı hariç tutulur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
              example:
                items:
                  - id: 22222222-2222-4222-8222-222222222222
                    username: bob
                    displayName: Bob
                    avatarUrl: null
                nextCursor: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/conversations/direct:
    post:
      tags: [Conversations]
      summary: Doğrudan konuşmayı oluşturma veya var olanı döndürme
      operationId: createDirectConversation
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/conversations/conversation.routes.ts
        - src/modules/conversations/conversation.schema.ts
        - src/modules/conversations/conversation.controller.ts
        - src/modules/conversations/conversation.service.ts
        - src/modules/conversations/conversation.errors.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectConversationRequest"
            example:
              userId: 22222222-2222-4222-8222-222222222222
      responses:
        "200":
          description: Aynı iki kullanıcı için konuşma zaten vardı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectConversation"
              example:
                id: 33333333-3333-4333-8333-333333333333
                type: DIRECT
                title: null
                createdAt: "2030-01-01T00:00:00.000Z"
                otherUser:
                  id: 22222222-2222-4222-8222-222222222222
                  username: bob
                  displayName: Bob
                  avatarUrl: null
        "201":
          description: Yeni doğrudan konuşma oluşturuldu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectConversation"
              example:
                id: 33333333-3333-4333-8333-333333333333
                type: DIRECT
                title: null
                createdAt: "2030-01-01T00:00:00.000Z"
                otherUser:
                  id: 22222222-2222-4222-8222-222222222222
                  username: bob
                  displayName: Bob
                  avatarUrl: null
        "400":
          description: Body doğrulanamadı veya kullanıcı kendisiyle konuşma başlatmaya çalıştı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation:
                  $ref: "#/components/examples/ValidationErrorExample"
                cannotMessageSelf:
                  value:
                    error:
                      code: CANNOT_MESSAGE_SELF
                      message: You cannot start a conversation with yourself
                      requestId: 77777777-7777-4777-8777-777777777777
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "404":
          description: Hedef kullanıcı yok, aktif değil veya soft-delete edilmiş
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: USER_NOT_FOUND
                  message: User not found
                  requestId: 77777777-7777-4777-8777-777777777777
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/conversations/group:
    post:
      tags: [Conversations]
      summary: Create a group conversation
      operationId: createGroupConversation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupConversationRequest"
            example:
              title: Product team
              userIds:
                - 22222222-2222-4222-8222-222222222222
                - 33333333-3333-4333-8333-333333333333
      responses:
        "201":
          description: Group created; caller is OWNER and requested users are MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupConversation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "404":
          description: At least one requested user is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/conversations:
    get:
      tags: [Conversations]
      summary: Aktif DIRECT ve GROUP konuşmalarını listeleme
      operationId: listConversations
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/conversations/conversation.routes.ts
        - src/modules/conversations/conversation.schema.ts
        - src/modules/conversations/conversation.controller.ts
        - src/modules/conversations/conversation.service.ts
        - src/modules/conversations/conversation.repository.ts
      parameters:
        - name: cursor
          in: query
          required: false
          description: Önceki cevabın `nextCursor` değeri; opak base64url string olarak kullanılmalıdır.
          schema:
            type: string
            minLength: 1
            maxLength: 768
          example: eyJ2IjoxLCJsYXN0TWVzc2FnZUF0IjoiMjAzMC0wMS0wMVQwMDowMDowMC4wMDBaIiwiY3JlYXRlZEF0IjoiMjAyOS0xMi0zMVQwMDowMDowMC4wMDBaIiwiaWQiOiIzMzMzMzMzMy0zMzMzLTQzMzMtODMzMy0zMzMzMzMzMzMzMzMifQ
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
      responses:
        "200":
          description: Son mesaja göre azalan sırada konuşma sayfası
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
              example:
                items:
                  - id: 33333333-3333-4333-8333-333333333333
                    type: DIRECT
                    title: null
                    createdAt: "2029-12-31T00:00:00.000Z"
                    otherUser:
                      id: 22222222-2222-4222-8222-222222222222
                      username: bob
                      displayName: Bob
                      avatarUrl: null
                    lastMessageAt: "2030-01-01T00:00:00.000Z"
                    lastMessage:
                      id: 44444444-4444-4444-8444-444444444444
                      body: Merhaba
                      senderId: 22222222-2222-4222-8222-222222222222
                      createdAt: "2030-01-01T00:00:00.000Z"
                      deletedAt: null
                    unreadCount: 1
                nextCursor: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/conversations/{conversationId}:
    get:
      tags: [Conversations]
      summary: Aktif üyesi olunan DIRECT veya GROUP konuşmasını alma
      operationId: getConversation
      security:
        - bearerAuth: []
      x-source-files:
        - src/modules/conversations/conversation.routes.ts
        - src/modules/conversations/conversation.schema.ts
        - src/modules/conversations/conversation.controller.ts
        - src/modules/conversations/conversation.service.ts
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Konuşma detayı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
              example:
                id: 33333333-3333-4333-8333-333333333333
                type: DIRECT
                title: null
                createdAt: "2030-01-01T00:00:00.000Z"
                otherUser:
                  id: 22222222-2222-4222-8222-222222222222
                  username: bob
                  displayName: Bob
                  avatarUrl: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BearerUnauthorized"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Conversations]
      summary: Update a GROUP title
      operationId: updateGroupTitle
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupTitleRequest"
      responses:
        "200":
          description: Updated group
          content:
