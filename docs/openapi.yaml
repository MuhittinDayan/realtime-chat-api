      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: GROUP
        title:
          type: string
          minLength: 1
          maxLength: 120
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GroupMember"
    Conversation:
      oneOf:
        - $ref: "#/components/schemas/DirectConversation"
        - $ref: "#/components/schemas/GroupConversation"
      discriminator:
        propertyName: type
    LastMessage:
      type: object
      additionalProperties: false
      required: [id, body, senderId, createdAt, deletedAt]
