          format: uuid
        type:
          type: string
          const: DIRECT
        title:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        otherUser:
          $ref: "#/components/schemas/PublicPeerUser"
    GroupMember:
      type: object
      additionalProperties: false
