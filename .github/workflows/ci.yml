name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Start PostgreSQL and MinIO, then apply test migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_test
        run: |
          docker compose up -d --wait postgres minio
          npm run setup:storage
          docker compose exec -T postgres createdb -U postgres chat_test
          npm run prisma:migrate:deploy

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs postgres minio

      - name: Stop local services
        if: always()
        run: docker compose down -v
